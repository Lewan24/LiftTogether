services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: lifttogether
      POSTGRES_USER: lifttogether_app
      POSTGRES_PASSWORD: lifttogether_app
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifttogether_app -d lifttogether"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:5
    environment: { ADMINER_DEFAULT_SERVER: postgres }
    ports: ["127.0.0.1:${ADMINER_PORT:-8081}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  postgres-data:
