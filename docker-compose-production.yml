# Paste into Portainer > Stacks > Add stack (Docker Standalone).
# Replace every CHANGE_ME password below; use hex database passwords.
# Set your admin email and public hostname. HTTPS proxy required (see docs).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: lift
      POSTGRES_USER: liftowner
      POSTGRES_PASSWORD: CHANGE_ME_OWNER_PASSWORD
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liftowner -d lift"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]
    restart: unless-stopped
  # Creates the restricted API database user without a local init script.
  db-init:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: CHANGE_ME_OWNER_PASSWORD
      APP_DB_PASSWORD: CHANGE_ME_APP_PASSWORD
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql -h postgres -U liftowner -d lift -v ON_ERROR_STOP=1 -v app_password="$$APP_DB_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE liftapp LOGIN PASSWORD %L', :'app_password')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'liftapp')
        \gexec
        GRANT CONNECT ON DATABASE lift TO liftapp;
        GRANT USAGE ON SCHEMA public TO liftapp;
        ALTER DEFAULT PRIVILEGES FOR ROLE liftowner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO liftapp;
        ALTER DEFAULT PRIVILEGES FOR ROLE liftowner IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO liftapp;
        SQL
    depends_on:
      postgres: { condition: service_healthy }
    networks: [private]
  migrate:
    image: lewan24/lifttogether-api:latest
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=postgres;Database=lift;Username=liftowner;Password="CHANGE_ME_OWNER_PASSWORD";Maximum Pool Size=10
      Bootstrap__AdminEmail: admin@example.com
      Bootstrap__AdminPassword: CHANGE_ME_ADMIN_PASSWORD
    depends_on:
      db-init: { condition: service_completed_successfully }
    networks: [private]
  api:
    image: lewan24/lifttogether-api:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__AutoInitialize: "false"
      ConnectionStrings__Database: Host=postgres;Database=lift;Username=liftapp;Password="CHANGE_ME_APP_PASSWORD";Maximum Pool Size=30
      Proxy__TrustedNetworks__0: 172.30.24.0/24
      AllowedHosts: gym.example.com
    volumes: ["api-keys:/app/keys"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [private]
    restart: unless-stopped
  frontend:
    image: lewan24/lifttogether-web:latest
    ports: ["127.0.0.1:8443:8080"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api: { condition: service_healthy }
    networks: [private]
    restart: unless-stopped
volumes:
  postgres-data:
  api-keys:
networks:
  private:
    ipam:
      config: [{ subnet: 172.30.24.0/24 }]
